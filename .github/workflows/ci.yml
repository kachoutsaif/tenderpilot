name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tenderpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d tenderpilot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/tenderpilot_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests (unitaires + intégration pgvector)
        run: pytest -v

      # --- Évaluation de la recherche (semaine 4) : sans LLM, donc gratuite et reproductible ---
      - name: Cache du modèle d'embedding
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ hashFiles('src/tenderpilot/rag/embeddings.py') }}

      - name: Évaluation de la recherche (corpus figé)
        env:
          # base vidée par le script : nom en _test obligatoire (garde-fou du script)
          EVAL_DATABASE_URL: postgresql://test:test@localhost:5432/tenderpilot_test
          EMBEDDING_CACHE_DIR: /home/runner/.cache/fastembed
        run: python scripts/evaluate_ci.py --summary "$GITHUB_STEP_SUMMARY"

      - name: Conserver les résultats détaillés
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-recherche
          path: out/evaluation_ci.json
          if-no-files-found: ignore
