name: Image Docker

# Construit l'image de l'application et la publie dans le registre de GitHub (ghcr.io).
# - Sur une pull request : construction SEULEMENT (vérifie que le Dockerfile fonctionne).
# - Sur main : construction + publication, avec deux étiquettes :
#     latest       -> la dernière version de main
#     sha-<commit> -> une version FIGÉE, à utiliser pour déployer (reproductible)
# Aucun identifiant AWS ici : le serveur AWS téléchargera l'image lui-même.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write # publier dans ghcr.io avec le jeton fourni par GitHub (GITHUB_TOKEN)

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à ghcr.io (seulement sur main)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # jeton temporaire, valable le temps du job

      - name: Étiquettes de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Construire (et publier sur main)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64 # le serveur t3.small est un processeur x86
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache des couches Docker entre deux lancements : les dépendances Python ne
          # sont réinstallées que si pyproject.toml change.
          cache-from: type=gha
          cache-to: type=gha,mode=max
