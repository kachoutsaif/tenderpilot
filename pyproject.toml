[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenderpilot"
version = "0.1.0"
description = "Agent d'analyse d'appels d'offres publics (RAG + agents LLM)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "psycopg[binary]>=3.1",
  "pgvector>=0.2.5",
  "numpy>=1.26",
  "openai>=1.30",
  "fastembed>=0.3",
  "pypdf>=4.0",
  "langgraph>=1.0,<2",
  "mcp>=2.2,<3",
]

[project.scripts]
tenderpilot-mcp = "tenderpilot.mcpserver.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: tests qui ont besoin d'une vraie base Postgres + pgvector (TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# Depends(...) en valeur par défaut est le style normal de FastAPI
extend-immutable-calls = ["fastapi.Depends"]
